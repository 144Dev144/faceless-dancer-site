services:
  postgres:
    image: postgres:16-alpine
    container_name: faceless-dancer-postgres
    command: ["postgres", "-c", "port=${POSTGRES_PORT:-5432}"]
    environment:
      POSTGRES_DB: faceless_dancer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ${POSTGRES_HOST_PATH:-/var/lib/faceless-dancer/postgres}:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:${POSTGRES_PORT:-5432}"
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: faceless-dancer-server
    depends_on:
      postgres:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ./.env
    environment:
      PORT: "${PORT:-3001}"
      DATABASE_URL: "${DATABASE_URL_DOCKER:-postgresql://postgres:postgres@postgres:${POSTGRES_PORT:-5432}/faceless_dancer}"
      DATABASE_POOL_MAX: "${DATABASE_POOL_MAX:-5}"
      DATABASE_CONNECTION_TIMEOUT_MS: "${DATABASE_CONNECTION_TIMEOUT_MS:-5000}"
      DATABASE_IDLE_TIMEOUT_MS: "${DATABASE_IDLE_TIMEOUT_MS:-30000}"
      DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS: "${DATABASE_IDLE_IN_TRANSACTION_TIMEOUT_MS:-60000}"
      DANCEOFF_REDIS_ENABLED: "${DANCEOFF_REDIS_ENABLED:-false}"
      DANCEOFF_REDIS_URL: "${DANCEOFF_REDIS_URL:-}"
      DANCEOFF_REDIS_USERNAME: "${DANCEOFF_REDIS_USERNAME:-}"
      DANCEOFF_REDIS_PASSWORD: "${DANCEOFF_REDIS_PASSWORD:-}"
      DANCEOFF_REDIS_TLS: "${DANCEOFF_REDIS_TLS:-false}"
      RUN_MIGRATIONS_ON_START: "${RUN_MIGRATIONS_ON_START:-false}"
      REMOTE_GENERATION_ENABLED: "${REMOTE_GENERATION_ENABLED:-false}"
      LAUNCH_SERVER_URL: "${LAUNCH_SERVER_URL_DOCKER:-http://host.docker.internal:4100}"
      LAUNCH_SERVER_INTERNAL_TOKEN: "${LAUNCH_SERVER_INTERNAL_TOKEN:-local-development-token}"
    volumes:
      - ${BEAT_STORAGE_HOST_PATH:-/var/lib/faceless-dancer/beat-storage}:/app/beat-storage
      - ${DANCE_MOTION_STORAGE_HOST_PATH:-./data}:/app/data
    ports:
      - "127.0.0.1:${PORT:-3001}:${PORT:-3001}"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_SOLANA_NETWORK: "${VITE_SOLANA_NETWORK:-devnet}"
        VITE_SOLANA_RPC_URL: "${VITE_SOLANA_RPC_URL:-https://api.devnet.solana.com}"
        VITE_FACELESS_PRICE_RPC_URL: "${VITE_FACELESS_PRICE_RPC_URL:-https://solana-rpc.publicnode.com}"
        SECONDARY_RPC_NODE: "${SECONDARY_RPC_NODE:-}"
    container_name: faceless-dancer-client
    depends_on:
      - server
    environment:
      SERVER_PORT: "${PORT:-3001}"
    ports:
      - "127.0.0.1:${CLIENT_DOCKER_PORT:-8080}:80"
    restart: unless-stopped
