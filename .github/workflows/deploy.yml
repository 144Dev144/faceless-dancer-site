name: Deploy faceless-dancer-site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: faceless-dancer-site-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preflight persistent paths on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.108.242.227
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            PERSIST_ROOT="/var/lib/faceless-dancer"

            mkdir -p "$PERSIST_ROOT/data" "$PERSIST_ROOT/beat-storage" "$PERSIST_ROOT/worker-models"

            case "$APP_DIR" in
              "$PERSIST_ROOT"|"$PERSIST_ROOT"/*)
                echo "Refusing deploy: VPS_APP_DIR overlaps persistent storage path"
                exit 1
                ;;
            esac

            mkdir -p "$APP_DIR"

      - name: Copy repo to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 65.108.242.227
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "."
          target: ${{ secrets.VPS_APP_DIR }}
          rm: true
          strip_components: 0
          timeout: 30m
          command_timeout: 30m

      - name: Write .env on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: 65.108.242.227
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: ENV_FILE
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            mkdir -p "$APP_DIR"
            printf "%s" "$ENV_FILE" > "$APP_DIR/.env"

            set_env_value() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" "$APP_DIR/.env"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$APP_DIR/.env"
              else
                printf '%s=%s\n' "$key" "$value" >> "$APP_DIR/.env"
              fi
            }

            # These are the established production bindings behind the existing proxy.
            # Do not let local Docker ports from an ENV_FILE secret replace them.
            set_env_value NODE_ENV production
            set_env_value PORT 3001
            set_env_value CLIENT_DEV_PORT 5173
            set_env_value CLIENT_DOCKER_PORT 8080
            set_env_value POSTGRES_PORT 5432
            set_env_value POSTGRES_HOST_PORT 55432
            set_env_value DATABASE_POOL_MAX 5
            set_env_value REMOTE_GENERATION_ENABLED true

            grep -qE '^LAUNCH_SERVER_URL_DOCKER=https?://[^[:space:]]+' "$APP_DIR/.env" || {
              echo "ENV_FILE must define LAUNCH_SERVER_URL_DOCKER" >&2
              exit 1
            }
            grep -qE '^LAUNCH_SERVER_INTERNAL_TOKEN=.{8,}$' "$APP_DIR/.env" || {
              echo "ENV_FILE must define LAUNCH_SERVER_INTERNAL_TOKEN" >&2
              exit 1
            }

            echo "Production remote-generation configuration validated"

      - name: Deploy containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 65.108.242.227
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_DIR }}"

            mkdir -p /var/lib/faceless-dancer/data /var/lib/faceless-dancer/beat-storage /var/lib/faceless-dancer/worker-models

            docker compose down || true
            docker compose up -d --build

            docker inspect faceless-dancer-server --format '{{range .Mounts}}{{println .Source " -> " .Destination}}{{end}}'
